name: Publish to MCP Registry

# Publishes this server to the official MCP registry so it is discoverable from
# Claude, Cursor and the other clients that read it.
#
# Auth is GitHub OIDC, deliberately: the alternative (`mcp-publisher login
# github`) is a browser device flow, which cannot run unattended. OIDC also
# proves the io.github.avisre/* namespace from the repository itself, so no
# token has to be stored anywhere.
#
# Publishing the npm package is NOT done here — that needs an NPM_TOKEN secret
# which is not set on this repo. `npm publish` is run by hand; this workflow
# only registers the already-published package with the registry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
